<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContentForge</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">ContentForge</span>
    </div>
    <div id="user-badge" class="user-badge hidden">
      <span id="user-email"></span>
      <span id="sub-pill" class="pill"></span>
      <button id="logout-btn" class="ghost-btn">Выйти</button>
    </div>
  </header>

  <main id="auth-screen" class="screen">
    <div class="auth-card">
      <h1>Личная фабрика роликов</h1>
      <p class="sub">Вход только по инвайту — доступ для тебя и твоего круга.</p>

      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Вход</button>
        <button class="tab-btn" data-tab="register">Регистрация</button>
      </div>

      <form id="login-form" class="tab-panel active">
        <input type="text" id="login-email" placeholder="Email или логин" required />
        <input type="password" id="login-password" placeholder="Пароль" required />
        <button type="submit" class="primary-btn">Войти</button>
        <p class="error" id="login-error"></p>
      </form>

      <form id="register-form" class="tab-panel">
        <input type="text" id="reg-email" placeholder="Email или логин" required />
        <input type="password" id="reg-password" placeholder="Пароль" required />
        <input type="text" id="reg-invite" placeholder="Инвайт-код (если есть)" />
        <button type="submit" class="primary-btn">Создать аккаунт</button>
        <p class="error" id="reg-error"></p>
      </form>

      <div class="oauth-divider"><span>или</span></div>

      <div class="oauth-block">
        <input type="text" id="oauth-invite" placeholder="Инвайт-код (для первого входа через Google/Telegram)" />
        <div id="google-btn-container"></div>
        <div id="telegram-btn-container"></div>
        <p class="error" id="oauth-error"></p>
      </div>
    </div>
  </main>

  <main id="dashboard-screen" class="screen hidden">

    <section id="paywall" class="paywall hidden">
      <h2>Нужна подписка</h2>
      <p>Генерация роликов доступна по подписке. Оформи прямо тут — оплата картой через Stripe.</p>
      <button id="subscribe-btn" class="primary-btn">Оформить подписку</button>
    </section>

    <section class="assistant-panel">
      <h2>Ассистент по темам <span class="badge">Claude</span></h2>
      <div id="assistant-log" class="assistant-log"></div>
      <div class="assistant-input-row">
        <input type="text" id="assistant-input" placeholder="Например: придумай тему про генерацию видео из фото товара" />
        <button id="assistant-send-btn" class="ghost-btn">Спросить</button>
      </div>
    </section>

    <section class="create-card">
      <h2>Новый ролик</h2>
      <input type="text" id="job-topic" placeholder="Тема / бриф ролика" />
      <input type="text" id="job-url" placeholder="Ссылка на референс (необязательно)" />
      <select id="job-aspect">
        <option value="9:16" selected>9:16 — Reels / Shorts</option>
        <option value="1:1">1:1 — квадрат</option>
        <option value="16:9">16:9 — широкий</option>
      </select>
      <button id="create-job-btn" class="primary-btn" style="margin-top:12px;">Сгенерировать</button>
    </section>

    <section class="analytics-panel">
      <h2>Аналитика</h2>
      <div id="my-stats" class="stat-grid"></div>
      <div id="my-timeline" class="chart-row"></div>
    </section>

    <section class="jobs-list">
      <h2>Мои ролики</h2>
      <div id="jobs-container"></div>
    </section>

    <section id="admin-panel" class="admin-panel hidden">
      <h2>Админка</h2>
      <div id="admin-stats" class="stat-grid"></div>
      <div id="admin-timeline" class="chart-row"></div>
      <h3 class="admin-subhead">Пользователи</h3>
      <div id="admin-users-container"></div>
    </section>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
